# ==============================================================================
# Smart Canteen Management System - Enterprise Configuration
# ==============================================================================
spring.application.name=smart-canteen-management
server.port=8080

# ------------------------------------------------------------------------------
# DATABASE CONFIGURATION
# (Default: High-speed Embedded H2 with MySQL Compatibility mode for instant plug-and-play.
#  To switch to MySQL Community Edition Server, uncomment the MySQL section below.)
# ------------------------------------------------------------------------------

# --- In-Memory Fast Development Database (Default, zero setup required) ---
spring.datasource.url=jdbc:h2:mem:canteen_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Production MySQL Community Edition Configuration (Uncomment when running MySQL Server) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/smart_canteen_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_mysql_password

# ------------------------------------------------------------------------------
# JPA / HIBERNATE SETTINGS
# ------------------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Use MySQL Dialect when using MySQL Server:
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# SQL Seed Data Initializer
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# ------------------------------------------------------------------------------
# LOGGING CONFIGURATION
# ------------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.smartcanteen=DEBUG
logging.level.org.springframework.web.socket=INFO

# ------------------------------------------------------------------------------
# NOTIFICATION SETTINGS (SMS / Push Simulation)
# ------------------------------------------------------------------------------
canteen.notification.sms.enabled=true
canteen.notification.sms.sender-id=CANTEEN-ALERTS
canteen.kds.audio-alerts.enabled=true

# ------------------------------------------------------------------------------
# SECURITY / ACCESS PASSWORDS
# ------------------------------------------------------------------------------
canteen.auth.admin.password=owner123
canteen.auth.kitchen.password=kitchen123
